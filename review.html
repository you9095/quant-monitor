<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盘后复盘 · 五策略监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-base: #0a0a0f; --bg-elevated: #12121a; --bg-surface: #1a1a28;
  --bg-hover: #222236; --text-primary: #e8e8f0; --text-secondary: #a0a0b8;
  --text-muted: #606078; --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --qixing: #3b82f6; --r32: #10b981; --zhuidian: #f59e0b;
  --color-up: #10b981; --color-down: #ef4444;
  --color-nodata: #606078;
  --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body { font-family: var(--font-sans); background: var(--bg-base); color: var(--text-primary); min-height: 100vh; line-height: 1.5; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* 顶部 */
.topbar { height: 56px; background: var(--bg-elevated); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
.topbar-brand { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.topbar-brand .back { color: var(--text-secondary); text-decoration: none; font-size: 13px; margin-right: 12px; transition: color 0.2s; }
.topbar-brand .back:hover { color: var(--text-primary); }
.topbar-meta { color: var(--text-secondary); font-size: 12px; }

/* 日期选择 */
.date-bar { padding: 16px 24px; background: var(--bg-elevated); border-bottom: 1px solid var(--border-subtle); }
.date-bar select {
  background: var(--bg-surface); border: 1px solid var(--border-medium); color: var(--text-primary);
  padding: 6px 12px; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 13px; cursor: pointer;
}

/* 汇总卡片 */
.summary-section { padding: 24px; }
.summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1024px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .summary-grid { grid-template-columns: 1fr; } }
.summary-card {
  background: var(--bg-surface); border-radius: var(--radius-md); padding: 20px;
  border: 1px solid var(--border-subtle); text-align: center;
}
.summary-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.summary-card .value { font-family: var(--font-mono); font-size: 28px; font-weight: 700; }
.summary-card .value.up { color: var(--color-up); }
.summary-card .value.down { color: var(--color-down); }
.summary-card .value.nodata { color: var(--color-nodata); font-style: italic; }
.summary-card .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* 策略复盘 */
.review-section { padding: 24px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.section-title { font-size: 14px; font-weight: 600; }
.strategy-review {
  background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle);
  margin-bottom: 16px; overflow: hidden;
}
.review-header {
  display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background 0.2s;
}
.review-header:hover { background: var(--bg-hover); }
.review-header .name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.review-header .color-dot { width: 10px; height: 10px; border-radius: 50%; }
.review-header .pnl { font-family: var(--font-mono); font-size: 18px; font-weight: 700; }
.review-header .pnl.up { color: var(--color-up); }
.review-header .pnl.down { color: var(--color-down); }
.review-header .pnl.nodata { color: var(--color-nodata); font-style: italic; }
.review-body { padding: 20px; display: none; }
.review-body.open { display: block; }
.review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 768px) { .review-grid { grid-template-columns: 1fr; } }
.review-block { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 16px; }
.review-block h4 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.review-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border-subtle); }
.review-row:last-child { border-bottom: none; }
.review-row .key { color: var(--text-secondary); }
.review-row .val { font-family: var(--font-mono); }
.review-row .val.up { color: var(--color-up); }
.review-row .val.down { color: var(--color-down); }
.review-row .val.nodata { color: var(--color-nodata); font-style: italic; }

/* 交易记录 */
.trade-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.trade-table th { text-align: left; padding: 10px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-medium); }
.trade-table td { padding: 10px; border-bottom: 1px solid var(--border-subtle); }
.trade-table tr:hover { background: var(--bg-hover); }
.trade-table .code { font-family: var(--font-mono); font-weight: 600; }
.trade-table .up { color: var(--color-up); }
.trade-table .down { color: var(--color-down); }

/* 笔记区 */
.notes-section { padding: 24px; background: var(--bg-elevated); border-top: 1px solid var(--border-subtle); }
.notes-textarea {
  width: 100%; min-height: 120px; background: var(--bg-surface); border: 1px solid var(--border-medium);
  border-radius: var(--radius-md); padding: 16px; color: var(--text-primary); font-family: var(--font-sans);
  font-size: 14px; line-height: 1.6; resize: vertical;
}
.notes-textarea:focus { outline: none; border-color: var(--r32); }
.notes-actions { display: flex; gap: 12px; margin-top: 12px; }
.notes-actions button {
  padding: 8px 20px; border-radius: var(--radius-sm); border: none; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; font-family: var(--font-sans);
}
.btn-primary { background: linear-gradient(135deg, var(--r32), #06b6d4); color: #0a0a0f; }
.btn-primary:hover { opacity: 0.9; transform: scale(1.02); }
.btn-secondary { background: var(--bg-surface); border: 1px solid var(--border-medium); color: var(--text-secondary); }
.btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }

/* 空状态 */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 14px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <a href="index.html" class="back">← 返回监控面板</a>
    <span>盘后复盘中心</span>
  </div>
  <div class="topbar-meta">
    <span id="review-date">2026-06-08</span>
  </div>
</header>

<div class="date-bar">
  <div class="container">
    <div class="review-tabs" id="review-tabs">
      <button class="review-tab active" data-type="daily" onclick="switchReviewType('daily')">📅 日复盘</button>
      <button class="review-tab" data-type="weekly" onclick="switchReviewType('weekly')">📊 周报</button>
      <button class="review-tab" data-type="monthly" onclick="switchReviewType('monthly')">🗓️ 月报</button>
      <button class="review-tab" data-type="chart" onclick="switchReviewType('chart')">📈 月度对比</button>
      <button class="review-tab" data-type="flow" onclick="switchReviewType('flow')">⚙️ 执行流程</button>
    </div>
    <div class="review-controls" id="review-controls">
      <select id="date-select" onchange="loadReview(this.value)" style="margin-right:8px">
        <option value="">加载中...</option>
      </select>
      <input type="date" id="start-date" style="margin-right:4px" onchange="onRangeChange()">
      <span style="color:var(--text-muted);margin:0 4px">~</span>
      <input type="date" id="end-date" style="margin-right:8px" onchange="onRangeChange()">
      <button class="btn-secondary" onclick="loadRangeView()">范围查询</button>
    </div>
    <div style="margin-top:8px;font-size:12px;color:var(--text-muted)" id="review-meta"></div>
  </div>
</div>

<style>
.review-tabs {
  display: inline-flex;
  gap: 4px;
  margin-right: 16px;
}
.review-tab {
  background: transparent;
  border: 1px solid var(--border-medium);
  color: var(--text-secondary);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-sans);
}
.review-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.review-tab.active {
  background: var(--bg-surface);
  border-color: var(--r32-end);
  color: var(--text-primary);
}
.review-controls {
  display: inline-flex;
  align-items: center;
  margin-top: 8px;
}
.review-controls select, .review-controls input[type=date] {
  background: var(--bg-surface);
  border: 1px solid var(--border-medium);
  color: var(--text-primary);
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 12px;
}
.range-result {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin: 12px 0;
}
.range-result .range-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.range-item {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 8px;
}
.range-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.range-item-date {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--r32-end);
  font-weight: 600;
}
.range-item-type {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: var(--text-muted);
}
</style>

<!-- 汇总区 -->
<section class="summary-section">
  <div class="container">
    <div class="summary-grid" id="summary-grid">
      <!-- 动态填充 -->
    </div>
  </div>
</section>

<!-- 策略复盘 -->
<section class="review-section">
  <div class="container">
    <div class="section-header">
      <span class="section-title">策略复盘</span>
      <span style="font-size:12px;color:var(--text-muted)">点击展开详情</span>
    </div>
    <div id="strategy-reviews">
      <!-- 动态填充 -->
    </div>
  </div>
</section>

<!-- 交易记录 -->
<section class="review-section" style="background:var(--bg-elevated);border-top:1px solid var(--border-subtle)">
  <div class="container">
    <div class="section-header">
      <span class="section-title">全部交易记录</span>
    </div>
    <div style="overflow-x:auto">
      <table class="trade-table" id="all-trades">
        <thead>
          <tr>
            <th>时间</th><th>策略</th><th>操作</th><th>代码</th>
            <th>名称</th><th>数量</th><th>价格</th><th>金额</th>
          </tr>
        </thead>
        <tbody>
          <!-- 动态填充 -->
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- 笔记区 -->
<section class="notes-section">
  <div class="container">
    <div class="section-header">
      <span class="section-title">复盘笔记</span>
      <span style="font-size:12px;color:var(--text-muted)">仅本地保存</span>
    </div>
    <textarea class="notes-textarea" id="review-notes" placeholder="记录今日观察、策略表现反思、明日计划..."></textarea>
    <div class="notes-actions">
      <button class="btn-primary" onclick="saveNotes()">保存笔记</button>
      <button class="btn-secondary" onclick="exportReview()">导出复盘</button>
    </div>
  </div>
</section>

<script>
const API_BASE = '/api/v1';

// 格式化函数：today_pnl 显示，null/undefined 显示"无数据"
function fmtPnl(v) { return v == null ? '无数据' : (v >= 0 ? '+' : '') + '¥' + Number(v).toFixed(2); }
function fmtReturn(v) { return v == null ? '无数据' : (v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%'; }
function pnlClass(v) { return v == null ? 'nodata' : (v >= 0 ? 'up' : 'down'); }

const STRATEGY_COLORS = { qixing: '#3b82f6', r32: '#10b981', zhuidian: '#f59e0b', sanhe: '#a855f7', lightning: '#facc15' };
const STRATEGY_NAMES = { qixing: '七星策略', r32: '三驾马车', zhuidian: '追电策略', sanhe: '三合策略 (Fusion)', lightning: '闪电策略 (Lightning)' };

let reviewData = null;
let availableDates = [];
let currentDate = null;

// ========== P2-3 (2026-06-27): 三 tab 切换 + 范围查询 ==========
let currentReviewType = 'daily';
let currentRange = [];  // 范围查询结果

async function switchReviewType(type) {
  currentReviewType = type;
  // 切换 tab 状态
  document.querySelectorAll('.review-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.type === type);
  });
  // 隐藏/显示 controls
  const controls = document.getElementById('review-controls');
  if (controls) controls.style.display = type === 'chart' ? 'none' : 'inline-flex';

  if (type === 'chart') {
    await renderMonthlyChart();
  } else if (type === 'flow') {
    await renderExecutionFlow();
  } else {
    await loadDateList();
  }
}

async function loadDateList() {
  const sel = document.getElementById('date-select');
  const meta = document.getElementById('review-meta');
  try {
    const res = await fetch(`${API_BASE}/review/dates`);
    const result = await res.json();
    if (result.code === 0) {
      availableDates = result.data.dates || [];
      // 加载当前 type 的所有可用日期（需要再调 range 拿具体 type）
      const typeRes = await fetch(`${API_BASE}/review/range?type=${currentReviewType}`);
      const typeResult = await typeRes.json();
      const typeDates = (typeResult.data.reviews || []).map(r => r.date);

      sel.innerHTML = typeDates.map(d =>
        `<option value="${d}">${d}${d === typeResult.data[typeResult.data.length === 0 ? 'latest' : 'latest'] || ''}</option>`
      ).join('');

      if (typeDates.length > 0) {
        sel.value = typeDates[typeDates.length - 1];
        const meta2 = document.getElementById('review-meta');
        if (meta2) meta2.textContent = `${currentReviewType === 'daily' ? '日' : currentReviewType === 'weekly' ? '周' : '月'}报共 ${typeDates.length} 份（全部 ${availableDates.length} 个日期）`;
        await loadReview(typeDates[typeDates.length - 1]);
      } else {
        const meta2 = document.getElementById('review-meta');
        if (meta2) meta2.textContent = `${currentReviewType} 类型暂无复盘`;
      }
    }
  } catch (e) {
    console.error('日期列表加载失败:', e);
    sel.innerHTML = '<option value="">加载失败</option>';
  }
}

function onRangeChange() {
  // 当 start/end 输入变化时，自动填到 sel
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  if (start && end) {
    const meta = document.getElementById('review-meta');
    if (meta) meta.textContent = `已选范围 ${start} ~ ${end}，点"范围查询"加载`;
  }
}

async function loadRangeView() {
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  const strategyReviews = document.getElementById('strategy-reviews');
  const meta = document.getElementById('review-meta');

  if (!start || !end) {
    alert('请选择起始和结束日期');
    return;
  }
  if (start > end) {
    alert('起始日期不能晚于结束日期');
    return;
  }

  meta.textContent = `查询中... ${start} ~ ${end}`;
  try {
    const res = await fetch(`${API_BASE}/review/range?type=${currentReviewType}&start=${start}&end=${end}`);
    const result = await res.json();
    if (result.code !== 0) {
      meta.textContent = `查询失败: ${result.message}`;
      return;
    }
    currentRange = result.data.reviews;
    meta.textContent = `${result.data.count} 份${currentReviewType === 'daily' ? '日' : currentReviewType === 'weekly' ? '周' : '月'}报 (${start} ~ ${end})`;

    if (currentRange.length === 0) {
      strategyReviews.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <p>该范围内无${currentReviewType}复盘数据</p>
        </div>`;
      return;
    }

    // 渲染范围结果（每个复盘一张卡）
    renderRangeResults(currentRange);
  } catch (e) {
    meta.textContent = `网络错误: ${e.message}`;
  }
}

function renderRangeResults(reviews) {
  const container = document.getElementById('strategy-reviews');
  container.innerHTML = `
    <div class="range-result">
      <div class="range-title">📚 ${currentReviewType === 'daily' ? '日' : currentReviewType === 'weekly' ? '周' : '月'}报列表 (${reviews.length} 份)</div>
      ${reviews.map(r => renderRangeItem(r)).join('')}
    </div>
  `;
}

function renderRangeItem(r) {
  const d = r.data || {};
  const type = d.type || r.type || '?';
  let title = '';
  let pnl = null;

  if (type === 'daily') {
    const headline = d.summary_L1?.headline || '(无 headline)';
    title = headline;
    pnl = d.performance?.total_cumulative_pnl;
  } else if (type === 'weekly') {
    const headline = d.weekly_view?.headline || '(无 weekly_view)';
    title = headline;
    pnl = null;
  } else if (type === 'monthly') {
    const headline = d.monthly_view?.headline || '(无 monthly_view)';
    title = headline;
    pnl = null;
  }

  const pnlHtml = pnl !== null && pnl !== undefined
    ? `<span class="${pnl >= 0 ? 'up' : 'down'}" style="font-family:var(--font-mono);font-weight:700">${pnl >= 0 ? '+' : ''}¥${pnl.toLocaleString('zh-CN', {minimumFractionDigits:0})}</span>`
    : '';

  return `
    <div class="range-item" onclick="loadReview('${r.date}')" style="cursor:pointer">
      <div class="range-item-header">
        <span class="range-item-date">${r.date}</span>
        <span class="range-item-type">${type}</span>
      </div>
      <div style="font-size:13px;color:var(--text-primary);margin:4px 0">${title}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--text-muted)">${r.filename}</span>
        ${pnlHtml}
      </div>
    </div>
  `;
}

// ========== P3-1 (2026-06-27): 月度对比图 ==========
let monthlyChart = null;

async function renderMonthlyChart() {
  const container = document.getElementById('strategy-reviews');
  const meta = document.getElementById('review-meta');
  meta.textContent = '加载月度数据...';

  // 先放一个 chart canvas 占位
  container.innerHTML = `
    <div class="monthly-chart-section">
      <div class="chart-header">
        <h3>📈 5 策略月度累计 P&L 对比</h3>
        <p style="color:var(--text-muted);font-size:12px">最近 6 个月累计收益率 (%)</p>
      </div>
      <div class="chart-canvas-wrap" style="height:380px;position:relative;background:var(--bg-surface);border-radius:var(--radius-md);padding:16px">
        <canvas id="monthlyChart"></canvas>
      </div>
      <div id="monthly-table-wrap" style="margin-top:20px"></div>
    </div>
  `;

  try {
    const res = await fetch(`${API_BASE}/dashboard/monthly_compare`);
    const result = await res.json();
    if (result.code !== 0) {
      meta.textContent = `加载失败: ${result.message}`;
      return;
    }
    const d = result.data;
    meta.textContent = `${d.months.length} 个月窗口 / ${Object.keys(d.strategies).length} 策略`;

    // 准备 Chart.js 数据
    const labels = d.months;
    const datasets = Object.entries(d.strategies).map(([sid, info]) => {
      const data = info.data.map(v => v === null ? null : v);
      return {
        label: info.name,
        data,
        borderColor: info.color,
        backgroundColor: info.color + '20',
        fill: false,
        tension: 0.3,
        pointRadius: 4,
        pointHoverRadius: 6,
        borderWidth: 2,
        spanGaps: true,
      };
    });

    // 销毁旧图
    if (monthlyChart) { monthlyChart.destroy(); }
    const ctx = document.getElementById('monthlyChart');
    if (ctx) {
      monthlyChart = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { color: '#a0a0b8', font: { family: 'SF Mono, Consolas, monospace', size: 11 }, usePointStyle: true, boxWidth: 8 } },
            tooltip: {
              backgroundColor: 'rgba(10,10,15,0.9)',
              titleColor: '#e8e8f0',
              bodyColor: '#a0a0b8',

async function loadReview(date) {
  if (!date) return;
  currentDate = date;
  document.getElementById('review-date').textContent = date;

  // P0-3 (2026-06-26): 改为读 /review/{date} 而非 overview API
  try {
    const res = await fetch(`${API_BASE}/review/${date}`);
    const result = await res.json();
    if (result.code === 0) {
      reviewData = result.data;
      renderFromReviewJson(result.data);
    } else {
      throw new Error(result.message);
    }
  } catch (e) {
    console.error('复盘数据加载失败:', e);
    document.getElementById('strategy-reviews').innerHTML = `
      <div class="empty-state">
        <div class="icon">📡</div>
        <p>数据服务未连接，请确认 real_data_server.py 已启动</p>
      </div>
    `;
    return;
  }

  // 加载笔记（从 review/{date}.json 的 user_notes 字段，localStorage 作为后备）
  const notesTextarea = document.getElementById('review-notes');
  let notes = '';
  if (reviewData && reviewData.user_notes) {
    notes = reviewData.user_notes;
  } else {
    notes = localStorage.getItem('review_notes_' + date) || '';
  }
  notesTextarea.value = notes;
}

// P0-3: 新渲染函数 — 从 review JSON 渲染而非 overview
function renderFromReviewJson(d) {
  // v1.0.1 (2026-06-26) 兼容: v2 schema 用 strategies_L2, v1 用 strategies
  if (!d.strategies && d.strategies_L2) d.strategies = d.strategies_L2;

  // 渲染顶部汇总（4 卡片）
  renderSummary(d);

  // 渲染策略复盘列表
  renderStrategyReviewsFromJson(d);

  // 渲染今日交易明细（从 today_actions API 拉）
  renderTradesForDate(currentDate);
}

function renderSummary(d) {
  const strategies = d.strategies || {};
  const sList = Object.entries(strategies).map(([k, v]) => ({
    strategy_id: k.startsWith('sanhe_5y') ? 'sanhe' : k.startsWith('sanhe_2y') ? 'sanhe' : k,
    strategy_name: STRATEGY_NAMES[k.startsWith('sanhe') ? 'sanhe' : k] || k,
    today_pnl: v.today_pnl != null ? v.today_pnl : null,
    today_return: v.today_return != null ? v.today_return : null,
    total_return: v.total_return || 0,
    annualized_return: v.annualized_return || 0,
    max_drawdown: v.max_drawdown || 0,
    sharpe: v.sharpe || 0,
    trades_count: v.trades_count || 0,
    version: v.version || '',
  }));

  // 计算组合指标（5 策略 × 10k 本金）
  const initial = 50000;
  const totalValue = sList.reduce((sum, s) => sum + 10000 * (1 + (s.total_return || 0) / 100), 0);
  const totalPnl = totalValue - initial;
  const totalReturn = (totalPnl / initial) * 100;
  const best = sList.reduce((a, b) => (a.today_return > b.today_return ? a : b), { today_return: -Infinity, strategy_name: '—' });
  const worst = sList.reduce((a, b) => (a.today_return < b.today_return ? a : b), { today_return: Infinity, strategy_name: '—' });

  const summaryGrid = document.getElementById('summary-grid');
  summaryGrid.innerHTML = `
    <div class="summary-card">
      <div class="label">总资金</div>
      <div class="value ${totalReturn >= 0 ? 'up' : 'down'}">¥${totalValue.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
      <div class="sub">初始 ¥${initial.toLocaleString()} · ${totalReturn >= 0 ? '+' : ''}${totalReturn.toFixed(2)}%</div>
    </div>
    <div class="summary-card">
      <div class="label">总盈亏</div>
      <div class="value ${totalPnl >= 0 ? 'up' : 'down'}">${totalPnl >= 0 ? '+' : ''}¥${totalPnl.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
      <div class="sub">${totalReturn >= 0 ? '+' : ''}${totalReturn.toFixed(2)}% · 5 策略</div>
    </div>
    <div class="summary-card">
      <div class="label">交易笔数</div>
      <div class="value">${sList.reduce((sum, s) => sum + (s.trades_count || 0), 0)}</div>
      <div class="sub">${sList.length} 个策略合计</div>
    </div>
    <div class="summary-card">
      <div class="label">最佳 / 最差</div>
      <div class="value ${best.today_return >= 0 ? 'up' : 'down'}" style="font-size:18px">
        ${best.strategy_name} ${best.today_return === -Infinity ? '--' : (best.today_return >= 0 ? '+' : '') + best.today_return.toFixed(2) + '%'}
      </div>
      <div class="sub ${worst.today_return >= 0 ? 'up' : 'down'}">
        ${worst.strategy_name} ${worst.today_return === Infinity ? '--' : (worst.today_return >= 0 ? '+' : '') + worst.today_return.toFixed(2) + '%'}
      </div>
    </div>
  `;
}

function renderStrategyReviewsFromJson(d) {
  const container = document.getElementById('strategy-reviews');
  const strategies = d.strategies || {};

  if (Object.keys(strategies).length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>${d.empty_template ? '该日期暂无复盘数据。可在下方笔记区开始记录。' : '无策略数据'}</p>
      </div>
    `;
    return;
  }

  // 把 sanhe_2y / sanhe_5y 合并成 sanhe 一组展示
  const grouped = {};
  for (const [k, v] of Object.entries(strategies)) {
    const sid = k.startsWith('sanhe') ? 'sanhe' : k;
    if (!grouped[sid]) grouped[sid] = [];
    grouped[sid].push({ key: k, data: v });
  }

  container.innerHTML = Object.entries(grouped).map(([sid, items]) => {
    const color = STRATEGY_COLORS[sid] || '#888';
    const main = items[0].data;
    const pnlClass = (main.today_return || 0) >= 0 ? 'up' : 'down';
    const versions = items.map(i => `<span class="tlt-tag" style="font-size:10px;padding:2px 6px;background:rgba(255,255,255,0.05);border-radius:4px;margin-right:4px">${i.key}: ${i.data.version || '—'}</span>`).join('');

    const reviewRowsHtml = items.map(i => `
      <div class="review-block" style="margin-bottom:12px">
        <h4>${i.key === 'sanhe_2y' ? '2Y 口径' : i.key === 'sanhe_5y' ? '5Y 口径' : '关键指标'}</h4>
        <div class="review-row"><span class="key">总收益</span><span class="val ${(i.data.total_return||0) >= 0 ? 'up' : 'down'}">${(i.data.total_return||0) >= 0 ? '+' : ''}${(i.data.total_return||0).toFixed(2)}%</span></div>
        <div class="review-row"><span class="key">年化</span><span class="val ${(i.data.annualized_return||0) >= 0 ? 'up' : 'down'}">${(i.data.annualized_return||0) >= 0 ? '+' : ''}${(i.data.annualized_return||0).toFixed(2)}%</span></div>
        <div class="review-row"><span class="key">回撤</span><span class="val ${(i.data.max_drawdown||0) >= 0 ? 'down' : 'down'}">${(i.data.max_drawdown||0).toFixed(2)}%</span></div>
        <div class="review-row"><span class="key">夏普</span><span class="val">${(i.data.sharpe||0).toFixed(2)}</span></div>
        <div class="review-row"><span class="key">交易笔数</span><span class="val">${i.data.trades_count||0}</span></div>
      </div>
    `).join('');

    return `
      <div class="strategy-review">
        <div class="review-header" onclick="toggleReview('${sid}')">
          <div class="name">
            <span class="color-dot" style="background:${color}"></span>
            ${STRATEGY_NAMES[sid] || sid}
            <span style="margin-left:8px">${versions}</span>
          </div>
          <div class="pnl ${pnlClass}">${(main.total_return||0) >= 0 ? '+' : ''}${(main.total_return||0).toFixed(2)}%</div>
        </div>
        <div class="review-body" id="review-${sid}">
          ${reviewRowsHtml}
        </div>
      </div>
    `;
  }).join('');
}

async function renderTradesForDate(date) {
  const tbody = document.querySelector('#all-trades tbody');
  try {
    const res = await fetch(`${API_BASE}/dashboard/today_actions_all`);
    const result = await res.json();
    const tbody = document.querySelector('#all-trades tbody');
    if (result.code !== 0 || !result.data.strategies) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">今日无交易</td></tr>';
      return;
    }
    const allTrades = [];
    for (const [sid, info] of Object.entries(result.data.strategies)) {
      const positions = info.positions || [];
      for (const p of positions) {
        allTrades.push({
          strategy: STRATEGY_NAMES[sid] || sid,
          strategy_id: sid,
          action: info.action || 'HOLD',
          code: p.code,
          name: p.name || '',
          qty: p.qty || p.weight || 0,
          price: p.cost || 0,
          amount: (p.qty || p.weight || 0) * (p.cost || 0),
        });
      }
    }
    const colorMap = STRATEGY_COLORS;
    tbody.innerHTML = allTrades.length > 0 ? allTrades.map(t => `
      <tr>
        <td>${date}</td>
        <td><span style="color:${colorMap[t.strategy_id]};font-weight:600">${t.strategy}</span></td>
        <td class="${(t.action||'').toUpperCase() === 'BUY' ? 'up' : (t.action||'').toUpperCase() === 'SELL' ? 'down' : ''}">${(t.action||'HOLD').toUpperCase()}</td>
        <td class="code">${t.code}</td>
        <td>${t.name}</td>
        <td>${typeof t.qty === 'number' ? t.qty.toLocaleString() : t.qty}</td>
        <td>¥${t.price}</td>
        <td>¥${t.amount.toLocaleString('zh-CN', {minimumFractionDigits:2})}</td>
      </tr>
    `).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">无持仓</td></tr>';
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">加载失败</td></tr>';
  }
}

function renderSummary(data) {
  const c = data.combined;
  const s = data.strategies;
  const totalTrades = s.reduce((sum, st) => sum + (st.trades_count || 0), 0);
  
  const best = s.reduce((a, b) => (a.today_return > b.today_return ? a : b));
  const worst = s.reduce((a, b) => (a.today_return < b.today_return ? a : b));
  
  const html = `
    <div class="summary-card">
      <div class="label">总资金</div>
      <div class="value ${c.total_return >= 0 ? 'up' : 'down'}">¥${c.total_asset.toLocaleString('zh-CN', {minimumFractionDigits:2})}</div>
      <div class="sub">初始 ¥30,000 · ${c.total_return >= 0 ? '+' : ''}${c.total_return}%</div>
    </div>
    <div class="summary-card">
      <div class="label">今日盈亏</div>
      <div class="value ${pnlClass(c.today_pnl)}">${fmtPnl(c.today_pnl)}</div>
      <div class="sub">${fmtReturn(c.today_return)}</div>
    </div>
    <div class="summary-card">
      <div class="label">交易笔数</div>
      <div class="value">${totalTrades}</div>
      <div class="sub">三策略合计</div>
    </div>
    <div class="summary-card">
      <div class="label">最佳 / 最差</div>
      <div class="value ${best.today_return >= 0 ? 'up' : 'down'}" style="font-size:20px">
        ${best.strategy_name} ${best.today_return >= 0 ? '+' : ''}${best.today_return}%
      </div>
      <div class="sub ${worst.today_return >= 0 ? 'up' : 'down'}">
        ${worst.strategy_name} ${worst.today_return >= 0 ? '+' : ''}${worst.today_return}%
      </div>
    </div>
  `;
  document.getElementById('summary-grid').innerHTML = html;
}

// 信号日期落后超过 MAX_STALE_DAYS 的策略视为"未运行"，跳过渲染
const MAX_STALE_DAYS = 5;
function isStrategyActive(s) {
  const sid = s.strategy_id || s.id;
  const sigDate = s.metrics?.signal_date || (window.__todayActions && window.__todayActions[sid]?.signal_date) || '';
  if (!sigDate) return false;
  const now = new Date();
  const sig = new Date(sigDate + 'T00:00:00');
  return Math.floor((now - sig) / (1000 * 60 * 60 * 24)) <= MAX_STALE_DAYS;
}
function activeStrategies(strategies) {
  return (strategies || []).filter(isStrategyActive);
}

function renderStrategyReviews(strategies) {
  const container = document.getElementById('strategy-reviews');
  const filtered = strategies ? activeStrategies(strategies) : [];
  
  container.innerHTML = filtered.map(s => {
    const color = STRATEGY_COLORS[s.strategy_id];
    const pnlClass = s.today_return == null ? 'nodata' : (s.today_return >= 0 ? 'up' : 'down');
    const holdingsHtml = (s.holdings || []).map(h => `
      <div class="review-row">
        <span class="key">${h.code} ${h.name}</span>
        <span class="val">${h.quantity}股 @ ¥${h.cost_price}</span>
      </div>
    `).join('');
    
    return `
      <div class="strategy-review">
        <div class="review-header" onclick="toggleReview('${s.strategy_id}')">
          <div class="name">
            <span class="color-dot" style="background:${color}"></span>
            ${s.strategy_name}
          </div>
          <div class="pnl ${pnlClass}">${fmtReturn(s.today_return)}</div>
        </div>
        <div class="review-body" id="review-${s.strategy_id}">
          <div class="review-grid">
            <div class="review-block">
              <h4>持仓明细</h4>
              ${holdingsHtml || '<div style="color:var(--text-muted);font-size:13px">无持仓</div>'}
            </div>
            <div class="review-block">
              <h4>关键指标</h4>
              <div class="review-row"><span class="key">总资产</span><span class="val">¥${s.total_asset.toFixed(2)}</span></div>
              <div class="review-row"><span class="key">今日盈亏</span><span class="val ${pnlClass(s.today_pnl)}">${fmtPnl(s.today_pnl)}</span></div>
              <div class="review-row"><span class="key">现金余额</span><span class="val">¥${s.cash.toFixed(2)}</span></div>
              <div class="review-row"><span class="key">仓位比例</span><span class="val">${(s.position_ratio * 100).toFixed(1)}%</span></div>
              <div class="review-row"><span class="key">交易笔数</span><span class="val">${s.trades_count}</span></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleReview(sid) {
  const el = document.getElementById('review-' + sid);
  el.classList.toggle('open');
}

async function renderAllTrades(strategies) {
  const tbody = document.querySelector('#all-trades tbody');
  let allTrades = [];
  
  for (const s of strategies) {
    try {
      const res = await fetch(`${API_BASE}/${s.strategy_id}/today_actions`);
      const result = await res.json();
      if (result.code === 0) {
        (result.data.trades || []).forEach(t => {
          allTrades.push({ ...t, strategy: s.strategy_name, strategy_id: s.strategy_id });
        });
      }
    } catch (e) {}
  }
  
  allTrades.sort((a, b) => a.time.localeCompare(b.time));
  
  tbody.innerHTML = allTrades.map(t => {
    const color = STRATEGY_COLORS[t.strategy_id];
    return `
      <tr>
        <td>${t.time}</td>
        <td><span style="color:${color};font-weight:600">${t.strategy}</span></td>
        <td class="${t.action === 'buy' ? 'up' : 'down'}">${t.action.toUpperCase()}</td>
        <td class="code">${t.code}</td>
        <td>${ETF_NAMES[t.code] || ''}</td>
        <td>${t.qty.toLocaleString()}</td>
        <td>¥${t.price}</td>
        <td>¥${t.amount.toFixed(2)}</td>
      </tr>
    `;
  }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">今日无交易</td></tr>';
}

const ETF_NAMES = {
  '159915': '创业板ETF', '159967': '国企红利', '513100': '纳指ETF',
  '513520': '日经ETF', '513500': '标普500', '510300': '沪深300', '563360': 'A50ETF'
}

// P0-4 (2026-06-26): 笔记改为 POST 到 /review/{date}/notes（写入 review/{date}.json）
async function saveNotes() {
  const date = currentDate || document.getElementById('review-date').textContent;
  const notes = document.getElementById('review-notes').value;
  const btn = event?.target;
  const oldText = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }

  try {
    const res = await fetch(`${API_BASE}/review/${date}/notes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes }),
    });
    const result = await res.json();
    if (result.code === 0) {
      // 同步 localStorage 作为后备
      localStorage.setItem('review_notes_' + date, notes);
      if (btn) {
        btn.textContent = '✓ 已保存';
        setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 1500);
      }
      // 静默成功（不弹 alert）
    } else {
      alert('保存失败: ' + result.message);
      if (btn) { btn.textContent = oldText; btn.disabled = false; }
    }
  } catch (e) {
    alert('保存失败: ' + e.message + '（已尝试写入本地 localStorage）');
    localStorage.setItem('review_notes_' + date, notes);
    if (btn) { btn.textContent = oldText; btn.disabled = false; }
  }
}

function exportReview() {
  const date = document.getElementById('review-date').textContent;
  const notes = document.getElementById('review-notes').value;
  
  let text = `盘后复盘报告 - ${date}\n`;
  text += '='.repeat(40) + '\n\n';
  
  if (reviewData) {
    const c = reviewData.combined;
    text += `【汇总】\n`;
    text += `总资金: ¥${c.total_asset} (${c.total_return >= 0 ? '+' : ''}${c.total_return}%)\n`;
    text += `今日盈亏: ${fmtPnl(c.today_pnl)} (${fmtReturn(c.today_return)})\n\n`;
    
    text += `【策略表现】\n`;
    reviewData.strategies.forEach(s => {
      text += `${s.strategy_name}: ${fmtReturn(s.today_return)} (${fmtPnl(s.today_pnl)})\n`;
    });
    text += '\n';
  }
  
  if (notes) {
    text += `【笔记】\n${notes}\n`;
  }
  
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `复盘_${date}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
