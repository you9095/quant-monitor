<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盈亏历史 · AI量化监控面板</title>
<script src="assets/chart.umd.min.js"></script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="dot"></span>
    <span id="brand-text">AI量化 · 监控面板</span>
  </div>
  <nav class="topbar-nav">
    <a href="index.html" class="nav-link">📊 概览</a>
    <a href="reconciliation.html" class="nav-link">📋 对账单</a>
    <a href="trades.html" class="nav-link">📝 买卖记录</a>
    <a href="pnl_history.html" class="nav-link active">📈 盈亏历史</a>
  </nav>
  <div class="topbar-time">
    <span id="current-date"></span>
    <span id="current-time">15:00:00</span>
  </div>
</header>

<main class="container">
  <!-- 筛选器 -->
  <div class="card" style="margin-bottom: 24px;">
    <div class="card-title">筛选条件</div>
    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: end;">
      <div>
        <label style="display:block;font-size:11px;color:var(--secondaryLabel);margin-bottom:4px;">策略</label>
        <select id="filter-strategy" style="background:var(--tertiarySystemBackground);border:1px solid var(--separator);color:var(--label);padding:8px 12px;border-radius:6px;font-family:inherit;">
          <option value="">全部策略</option>
          <option value="zhuidian">追电策略</option>
          <option value="qixing">七星策略</option>
          <option value="r32">三驾马车</option>
          <option value="sanhe">三合策略</option>
          <option value="lightning">闪电策略</option>
          <option value="goldcombo">黄金组合A</option>
        </select>
      </div>
      <div>
        <label style="display:block;font-size:11px;color:var(--secondaryLabel);margin-bottom:4px;">开始日期</label>
        <input type="date" id="filter-start" style="background:var(--tertiarySystemBackground);border:1px solid var(--separator);color:var(--label);padding:8px 12px;border-radius:6px;font-family:inherit;">
      </div>
      <div>
        <label style="display:block;font-size:11px;color:var(--secondaryLabel);margin-bottom:4px;">结束日期</label>
        <input type="date" id="filter-end" style="background:var(--tertiarySystemBackground);border:1px solid var(--separator);color:var(--label);padding:8px 12px;border-radius:6px;font-family:inherit;">
      </div>
      <div style="display:flex;gap:8px;">
        <button class="refresh-btn" onclick="loadPnLHistory()" style="height:40px;">🔄 刷新</button>
        <button class="refresh-btn" onclick="exportCSV()" style="background:var(--systemGreen);border-color:var(--systemGreen);">📥 导出CSV</button>
      </div>
    </div>
  </div>

  <!-- 统计卡片 -->
  <div class="card-grid" style="margin-bottom: 24px;" id="pnl-stats">
    <!-- 动态填充 -->
  </div>

  <!-- 图表区域 -->
  <div class="chart-container" style="margin-bottom: 24px;">
    <div class="chart-tabs">
      <span class="chart-tab active" onclick="switchChart('equity')">权益曲线</span>
      <span class="chart-tab" onclick="switchChart('pnl')">日盈亏</span>
      <span class="chart-tab" onclick="switchChart('drawdown')">回撤</span>
    </div>
    <canvas id="pnl-chart" height="400"></canvas>
  </div>

  <!-- 明细表格 -->
  <div class="card">
    <div class="section-header">
      <span class="section-title">盈亏明细</span>
      <span id="pnl-count" style="font-size:12px;color:var(--text-muted);">共 0 条</span>
    </div>
    <div class="table-wrapper" id="pnl-table">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>权益</th>
            <th>现金</th>
            <th>持仓市值</th>
            <th>日盈亏</th>
            <th>日收益%</th>
            <th>累计盈亏</th>
            <th>累计收益%</th>
            <th>持仓数</th>
            <th>重仓%</th>
            <th>数据源</th>
          </tr>
        </thead>
        <tbody id="pnl-body">
          <!-- 动态填充 -->
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="assets/common.js"></script>
<script>
/* ============================================================
   盈亏历史页面逻辑
   ============================================================ */

let allHistory = [];
let filteredHistory = [];
let emptyNote = '';
let currentChartType = 'equity';
let pnlChart = null;

async function loadPnLHistory() {
  const strategy = document.getElementById('filter-strategy').value;
  const start = document.getElementById('filter-start').value;
  const end = document.getElementById('filter-end').value;
  
  const params = new URLSearchParams();
  if (strategy) params.set('strategy', strategy);
  if (start) params.set('start', start);
  if (end) params.set('end', end);
  withMode(params);
  
  try {
    const res = await fetch(`${API_BASE}/api/v1/dashboard/pnl_history?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allHistory = data.history || [];
    emptyNote = data.note || '';
    updateNatureBanner(data);
    filteredHistory = allHistory;
    renderPnLStats();
    renderPnLTable();
    renderChart();
  } catch (e) {
    console.error('加载盈亏历史失败:', e);
    document.getElementById('pnl-body').innerHTML = 
      '<tr><td colspan="11" class="text-center" style="padding:40px;color:var(--tertiaryLabel)">加载失败: ' + e.message + '</td></tr>';
  }
}

function renderPnLStats() {
  const container = document.getElementById('pnl-stats');
  if (filteredHistory.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📈</div><div>暂无盈亏数据</div>' + (emptyNote ? `<div class="empty-nature-note">${emptyNote}</div>` : '') + '</div>';
    return;
  }
  
  const last = filteredHistory[filteredHistory.length - 1];
  const first = filteredHistory[0];
  const totalPnl = last.cumulative_pnl || 0;
  const totalReturn = last.cumulative_return_pct || 0;
  // 最大回撤：权益曲线从前期峰值回落的最大百分比（负值）
  const eqSeries = [...filteredHistory].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  let peak = -Infinity, maxDrawdown = 0;
  eqSeries.forEach(h => {
    const eq = (h.total_equity === null || h.total_equity === undefined) ? (h.equity || 0) : h.total_equity;
    if (eq > peak) peak = eq;
    if (peak > 0) { const dd = (eq - peak) / peak * 100; if (dd < maxDrawdown) maxDrawdown = dd; }
  });
  const winDays = filteredHistory.filter(h => (h.daily_pnl || 0) > 0).length;
  const totalDays = filteredHistory.length;
  const winRate = totalDays > 0 ? (filteredHistory.filter(h => (h.daily_pnl || 0) > 0).length / totalDays * 100).toFixed(1) : 0;
  
  const totalPnlClass = totalPnl > 0 ? 'pnl-pos' : (totalPnl < 0 ? 'pnl-neg' : '');
  
  document.getElementById('pnl-stats').innerHTML = `
    <div class="card-item"><div class="label">交易天数</div><div class="val">${filteredHistory.length}</div></div>
    <div class="card-item"><div class="label">累计盈亏</div><div class="val ${totalPnlClass}">${formatMoney(totalPnl)}</div></div>
    <div class="card-item"><div class="label">累计收益率</div><div class="val ${totalPnlClass}">${formatPct(totalReturn)}</div></div>
    <div class="card-item"><div class="label">最大回撤</div><div class="val pnl-neg">${maxDrawdown < 0 ? formatPct(maxDrawdown) : '0.00%'}</div></div>
    <div class="card-item"><div class="label">胜率</div><div class="val">${winRate}%</div></div>
    <div class="card-item"><div class="label">盈利天数</div><div class="val">${filteredHistory.filter(h => (h.daily_pnl || 0) > 0).length}/${filteredHistory.length}</div></div>
  `;
}

function renderPnLTable() {
  const tbody = document.getElementById('pnl-body');
  document.getElementById('pnl-count').textContent = `共 ${filteredHistory.length} 条`;
  
  if (filteredHistory.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="text-center" style="padding:40px;color:var(--tertiaryLabel)">暂无盈亏数据' + (emptyNote ? `<div class="empty-nature-note">${emptyNote}</div>` : '') + '</td></tr>';
    return;
  }
  
  // 按日期倒序
  const sorted = [...filteredHistory].sort((a, b) => b.date.localeCompare(a.date));
  
  tbody.innerHTML = sorted.map(h => {
    const pnlCl = pnlClass(h.daily_pnl);
    const cumCl = pnlClass(h.cumulative_pnl);
    return `
      <tr>
        <td>${h.date}</td>
        <td>${formatMoney(h.equity)}</td>
        <td>${formatMoney(h.cash)}</td>
        <td>${formatMoney(h.market_value)}</td>
        <td class="${pnlClass(h.daily_pnl)}">${formatMoney(h.daily_pnl)}</td>
        <td class="${pnlClass(h.daily_return_pct)}">${formatPct(h.daily_return_pct)}</td>
        <td class="${cumCl}">${formatMoney(h.cumulative_pnl)}</td>
        <td class="${cumCl}">${formatPct(h.cumulative_return_pct)}</td>
        <td>${h.positions_count || 0}</td>
        <td>${h.top_position_pct ? h.top_position_pct.toFixed(1) + '%' : '--'}</td>
        <td class="text-left">${h.data_source || 'live'}</td>
      </tr>
    `;
  }).join('');
}

function renderChart() {
  const ctx = document.getElementById('pnl-chart').getContext('2d');
  
  const sorted = [...filteredHistory].sort((a, b) => a.date.localeCompare(b.date));
  const labels = sorted.map(h => h.date.slice(5)); // MM-DD
  
  let data, label, borderColor, backgroundColor;
  
  switch (currentChartType) {
    case 'equity':
      data = sorted.map(h => (h.total_equity === null || h.total_equity === undefined) ? h.equity : h.total_equity);
      label = '总权益';
      borderColor = 'var(--systemBlue)';
      backgroundColor = 'rgba(10,132,255,0.1)';
      break;
    case 'pnl':
      data = sorted.map(h => h.daily_pnl);
      label = '日盈亏';
      borderColor = 'var(--systemGreen)';
      backgroundColor = 'rgba(48,209,88,0.1)';
      break;
    case 'drawdown': {
      let pk = -Infinity;
      data = sorted.map(h => {
        const eq = (h.total_equity === null || h.total_equity === undefined) ? (h.equity || 0) : h.total_equity;
        if (eq > pk) pk = eq;
        return pk > 0 ? ((eq - pk) / pk * 100) : 0;
      });
      label = '回撤(%)';
      borderColor = 'var(--systemRed)';
      backgroundColor = 'rgba(255,69,58,0.12)';
      break;
    }
  }
  
  if (pnlChart) pnlChart.destroy();
  
  pnlChart = new Chart(ctx, {
    type: currentChartType === 'pnl' ? 'bar' : 'line',
    data: {
      labels: labels,
      datasets: [{
        label: label,
        data: data,
        borderColor: borderColor,
        backgroundColor: backgroundColor,
        fill: currentChartType !== 'pnl',
        tension: 0.3,
        pointRadius: currentChartType === 'pnl' ? 0 : 3,
        pointHoverRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(28,28,30,0.9)',
          titleColor: '#fff',
          bodyColor: '#fff',
          padding: 12,
          cornerRadius: 8,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('zh-CN', {minimumFractionDigits: 2})}`
          }
        }
      },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'var(--tertiaryLabel)', maxTicksLimit: 10 } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'var(--tertiaryLabel)' } }
      }
    }
  });
}

function switchChart(type) {
  currentChartType = type;
  document.querySelectorAll('.chart-tab').forEach(t => {
    t.classList.toggle('active', t.onclick && t.onclick.toString().includes(type));
  });
  renderChart();
}

function exportCSV() {
  if (filteredHistory.length === 0) return;
  
  const headers = ['日期','权益','现金','持仓市值','日盈亏','日收益%','累计盈亏','累计收益%','持仓数','重仓%','数据源'];
  const rows = filteredHistory.map(h => [
    h.date, h.equity, h.cash, h.market_value, h.daily_pnl, h.daily_return_pct,
    h.cumulative_pnl, h.cumulative_return_pct, h.positions_count, h.top_position_pct, h.data_source
  ]);
  
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `pnl_history_${new Date().toISOString().split('T')[0]}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function formatMoney(v) {
  if (v === null || v === undefined) return '--';
  return (v >= 0 ? '+' : '') + v.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function formatPct(v) {
  if (v === null || v === undefined) return '--';
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function pnlClass(v) { return v > 0 ? 'pnl-pos' : (v < 0 ? 'pnl-neg' : ''); }

document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  const monthAgo = new Date(Date.now() - 30*86400000).toISOString().split('T')[0];
  document.getElementById('filter-start').value = monthAgo;
  document.getElementById('filter-end').value = today;
  
  loadPnLHistory();
  
  setInterval(() => {
    const now = new Date();
    document.getElementById('current-date').textContent = now.toLocaleDateString('zh-CN');
    document.getElementById('current-time').textContent = now.toLocaleTimeString('zh-CN', {hour12:false});
  }, 1000);
});
</script>
</body>
</html>
