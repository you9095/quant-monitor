<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对账单 · AI量化监控面板</title>
<script src="assets/chart.umd.min.js"></script>
<link rel="stylesheet" href="assets/common.css">
<style>
/* reconciliation.html 特有样式 */
.badge-filled { background: var(--systemBlue); color: white; }
.badge-pending { background: var(--systemOrange); color: white; }
.badge-rejected { background: var(--systemRed); color: white; }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="dot"></span>
    <span id="brand-text">AI量化 · 监控面板</span>
  </div>
  <nav class="topbar-nav">
    <a href="index.html" class="nav-link">📊 概览</a>
    <a href="reconciliation.html" class="nav-link active">📋 对账单</a>
    <a href="trades.html" class="nav-link">📝 买卖记录</a>
    <a href="pnl_history.html" class="nav-link">📈 盈亏历史</a>
  </nav>
  <div class="topbar-time">
    <span id="current-date"></span>
    <span id="current-time">15:00:00</span>
  </div>
</header>

<main class="container">
  <!-- 概览卡片 -->
  <div class="card-grid" style="margin-bottom: 24px;">
    <div class="card-item">
      <div class="label">账户余额</div>
      <div class="val text-mono" id="cash">--</div>
    </div>
    <div class="card-item">
      <div class="label">持仓市值</div>
      <div class="val text-mono" id="market-value">--</div>
    </div>
    <div class="card-item">
      <div class="label">总权益</div>
      <div class="val text-mono" id="total-equity">--</div>
    </div>
    <div class="card-item">
      <div class="label">当日盈亏</div>
      <div class="val" id="daily-pnl">--</div>
    </div>
  </div>

  <!-- 筛选器 -->
  <div class="card" style="margin-bottom: 24px;">
    <div class="card-title">筛选条件</div>
    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: end;">
      <div>
        <label style="display:block;font-size:11px;color:var(--secondaryLabel);margin-bottom:4px;">策略</label>
        <select id="filter-strategy" style="background:var(--tertiarySystemBackground);border:1px solid var(--separator);color:var(--label);padding:8px 12px;border-radius:6px;font-family:inherit;">
          <option value="">全部策略</option>
          <option value="zhuidian">追电策略</option>
          <option value="qixing">七星策略</option>
          <option value="r32">三驾马车</option>
          <option value="sanhe">三合策略</option>
          <option value="lightning">闪电策略</option>
          <option value="goldcombo">黄金组合A</option>
        </select>
      </div>
      <div>
        <label style="display:block;font-size:11px;color:var(--secondaryLabel);margin-bottom:4px;">开始日期</label>
        <input type="date" id="filter-start" style="background:var(--tertiarySystemBackground);border:1px solid var(--separator);color:var(--label);padding:8px 12px;border-radius:6px;font-family:inherit;">
      </div>
      <div>
        <label style="display:block;font-size:11px;color:var(--secondaryLabel);margin-bottom:4px;">结束日期</label>
        <input type="date" id="filter-end" style="background:var(--tertiarySystemBackground);border:1px solid var(--separator);color:var(--label);padding:8px 12px;border-radius:6px;font-family:inherit;">
      </div>
      <button class="refresh-btn" onclick="loadReconciliation()" style="height:40px;">🔄 刷新对账单</button>
    </div>
  </div>

  <!-- 对账概览卡片 -->
  <div class="card-grid" style="margin-bottom: 24px;" id="summary-cards">
    <!-- 动态填充 -->
  </div>

  <!-- 对账详情标签页 -->
  <div class="card">
    <div class="section-header">
      <span class="section-title">对账详情</span>
      <div class="section-tabs" id="recon-tabs">
        <span class="tab active" onclick="switchReconTab('overview')">概览</span>
        <span class="tab" onclick="switchReconTab('funds')">资金对账</span>
        <span class="tab" onclick="switchReconTab('positions')">持仓对账</span>
        <span class="tab" onclick="switchReconTab('orders')">订单对账</span>
        <span class="tab" onclick="switchReconTab('fees')">费用汇总</span>
      </div>
    </div>
    <div id="recon-content">
      <!-- 动态填充 -->
    </div>
  </div>
</main>

<script src="assets/common.js"></script>
<script>
/* ============================================================
   对账单页面逻辑
   ============================================================ */

let currentReconData = null;
let emptyNote = '';
let currentTab = 'overview';

async function loadReconciliation() {
  const strategy = document.getElementById('filter-strategy').value;
  const start = document.getElementById('filter-start').value;
  const end = document.getElementById('filter-end').value;
  
  const params = new URLSearchParams();
  if (strategy) params.set('strategy', strategy);
  if (start) params.set('start', start);
  if (end) params.set('end', end);
  withMode(params);
  
  try {
    const res = await fetch(`${API_BASE}/api/v1/dashboard/reconciliation?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentReconData = data;
    emptyNote = data.note || '';
    updateNatureBanner(data);
    fillTopKpis(data);
    renderSummaryCards(data);
    renderReconTab(currentTab);
  } catch (e) {
    console.error('加载对账单失败:', e);
    document.getElementById('recon-content').innerHTML = 
      '<div class="empty-state"><div class="icon">⚠️</div><div>加载失败: ' + e.message + '</div></div>';
  }
}

function plainMoney(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  return Number(v).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

// 顶部 4 个 KPI（账户余额 / 持仓市值 / 总权益 / 当日盈亏）
function fillTopKpis(data) {
  const t = (data && data.totals) || {};
  const put = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = plainMoney(v); };
  put('cash', t.cash);
  put('market-value', t.market_value);
  put('total-equity', t.total_equity);
  const dp = document.getElementById('daily-pnl');
  if (dp) {
    dp.textContent = (t.daily_pnl === null || t.daily_pnl === undefined) ? '--' : formatMoney(t.daily_pnl);
    dp.className = 'val ' + pnlClass(t.daily_pnl || 0);
  }
}

function renderSummaryCards(data) {
  const container = document.getElementById('summary-cards');
  if (!data || !data.per_strategy || Object.keys(data.per_strategy).length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div>暂无对账数据</div>' + (emptyNote ? `<div class="empty-nature-note">${emptyNote}</div>` : '') + '</div>';
    return;
  }
  
  let totalPnl = 0, totalCommission = 0, totalStampTax = 0, totalTransferFee = 0, totalSlippage = 0;
  let matched = 0, total = 0;
  
  const cards = Object.entries(data.per_strategy).map(([sid, s]) => {
    totalPnl += s.pnl || 0;
    totalCommission += s.total_commission || 0;
    totalStampTax += s.total_stamp_tax || 0;
    totalTransferFee += s.total_transfer_fee || 0;
    totalSlippage += s.total_slippage || 0;
    
    if (s.overall_match) matched++;
    total++;
    
    const matchIcon = s.overall_match ? '✅' : '❌';
    const pnlColor = (s.pnl || 0) > 0 ? 'pnl-pos' : ((s.pnl || 0) < 0 ? 'pnl-neg' : '');
    
    return `
      <div class="card-item">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:600;color:${STRATEGY_COLORS[sid]||'#fff'}">${s.name || sid}</span>
          <span class="badge" style="background:${s.overall_match?'rgba(48,209,88,0.2)':'rgba(255,69,58,0.2)'};color:${s.overall_match?'var(--systemGreen)':'var(--systemRed)'}">${matchIcon}</span>
        </div>
        <div class="val ${pnlClass(s.pnl)}" style="font-size:18px;">${formatMoney(s.pnl)}</div>
        <div class="label" style="margin-top:4px;">收益率: ${formatPct(s.return_pct)} | 现金: ${plainMoney(s.cash)} | 市值: ${plainMoney(s.market_value)}</div>
      `;
    }).join('');
  
  // 总计卡片
  const totalCard = `
    <div class="card-item" style="border-left:3px solid var(--systemBlue);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-weight:600;color:var(--systemBlue)">📊 总计</span>
        <span class="badge" style="background:${matched===total?'rgba(48,209,88,0.2)':'rgba(255,69,58,0.2)'};color:${matched===total?'var(--systemGreen)':'var(--systemRed)'}">${matched}/${total} 通过</span>
      </div>
      <div class="val ${pnlClass(totalPnl)}" style="font-size:22px;">${formatMoney(totalPnl)}</div>
      <div class="label" style="margin-top:4px;">费用: 佣金${formatMoney(totalCommission)} 印花税${formatMoney(totalStampTax)} 过户费${formatMoney(totalTransferFee)} 滑点${formatMoney(totalSlippage)}</div>
    `;
  
  container.innerHTML = totalCard + cards;
}

function pnlClass(v) { return v > 0 ? 'pnl-pos' : (v < 0 ? 'pnl-neg' : ''); }

function switchReconTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#recon-tabs .tab').forEach(t => {
    t.classList.toggle('active', t.onclick && t.onclick.toString().includes(tab));
  });
  renderReconTab(tab);
}

function renderReconTab(tab) {
  const container = document.getElementById('recon-content');
  if (!currentReconData) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div>请先加载对账单</div></div>';
    return;
  }
  if (!currentReconData.per_strategy || Object.keys(currentReconData.per_strategy).length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div>暂无对账数据</div>' + (emptyNote ? `<div class="empty-nature-note">${emptyNote}</div>` : '') + '</div>';
    return;
  }

  switch (tab) {
    case 'overview':
      renderOverviewTab();
      break;
    case 'funds':
      renderFundsTab();
      break;
    case 'positions':
      renderPositionsTab();
      break;
    case 'orders':
      renderOrdersTab();
      break;
    case 'fees':
      renderFeesTab();
      break;
  }
}

function renderOverviewTab() {
  const data = currentReconData;
  const html = `
    <div class="card-grid" style="margin-bottom:16px;">
      <div class="card-item">
        <div class="label">资金匹配</div>
        <div class="val ${data.cash_match ? 'pnl-pos' : 'pnl-neg'}">${data.cash_match ? '✅ 匹配' : '❌ 不匹配'}</div>
        <div class="label">差异: ${formatMoney(data.cash_diff)}</div>
      </div>
      <div class="card-item">
        <div class="label">权益匹配</div>
        <div class="val ${data.equity_match ? 'pnl-pos' : 'pnl-neg'}">${data.equity_match ? '✅ 匹配' : '❌ 不匹配'}</div>
        <div class="label">差异: ${formatMoney(data.equity_diff)}</div>
      </div>
      <div class="card-item">
        <div class="label">市值匹配</div>
        <div class="val ${data.mv_match ? 'pnl-pos' : 'pnl-neg'}">${data.mv_match ? '✅ 匹配' : '❌ 不匹配'}</div>
        <div class="label">差异: ${formatMoney(data.mv_diff)}</div>
      </div>
      <div class="card-item">
        <div class="label">持仓匹配</div>
        <div class="val ${data.position_match ? 'pnl-pos' : 'pnl-neg'}">${data.position_match ? '✅ 匹配' : '❌ 不匹配'}</div>
        <div class="label">差异: ${data.position_diffs?.length || 0} 处</div>
      </div>
      <div class="card-item">
        <div class="label">订单匹配</div>
        <div class="val ${data.order_match ? 'pnl-pos' : 'pnl-neg'}">${data.order_match ? '✅ 匹配' : '❌ 不匹配'}</div>
        <div class="label">差异: ${data.order_diffs?.length || 0} 处</div>
      </div>
      <div class="card-item">
        <div class="label">总体结论</div>
        <div class="val ${data.overall_match ? 'pnl-pos' : 'pnl-neg'}">${data.overall_match ? '✅ 全部通过' : '❌ 发现差异'}</div>
        <div class="label">容差: ±${data.tolerance} 元</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">策略级对账状态</div>
      <div id="strategy-recon-list">${Object.entries(data.per_strategy || {}).map(([sid, s]) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--separator);">
          <span style="font-weight:600;color:${STRATEGY_COLORS[sid]||'#fff'}">${s.name || sid}</span>
          <span class="${s.overall_match ? 'pnl-pos' : 'pnl-neg'}">${s.overall_match ? '✅' : '❌'}</span>
        </div>
      `).join('')}</div>
    </div>
  `;
  document.getElementById('recon-content').innerHTML = html;
}

function renderFundsTab() {
  const data = currentReconData;
  const rows = Object.entries(data.per_strategy || {}).map(([sid, s]) => `
    <tr>
      <td class="text-left"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${STRATEGY_COLORS[sid]||'#fff'};margin-right:8px;"></span>${s.name || sid}</td>
      <td>${formatMoney(s.cash_simulator)}</td>
      <td>${formatMoney(s.cash_broker)}</td>
      <td class="${pnlClass(s.cash_diff)}">${formatMoney(s.cash_diff)}</td>
      <td>${s.cash_match ? '✅' : '❌'}</td>
    </tr>
  `).join('');
  document.getElementById('recon-content').innerHTML = `
    <div class="table-wrapper">
      <table><thead><tr><th>策略</th><th>模拟器</th><th>券商</th><th>差异</th><th>状态</th></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

function renderPositionsTab() {
  const data = currentReconData;
  const rows = Object.entries(data.per_strategy || {}).map(([sid, s]) => `
    <tr>
      <td class="text-left"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${STRATEGY_COLORS[sid]||'#fff'};margin-right:8px;"></span>${s.name || sid}</td>
      <td>${formatMoney(s.mv_simulator)}</td>
      <td>${formatMoney(s.mv_broker)}</td>
      <td class="${pnlClass(s.mv_diff)}">${formatMoney(s.mv_diff)}</td>
      <td>${s.mv_match ? '✅' : '❌'}</td>
    </tr>
  `).join('');
  document.getElementById('recon-content').innerHTML = `
    <div class="table-wrapper">
      <table><thead><tr><th>策略</th><th>模拟器市值</th><th>券商市值</th><th>差异</th><th>状态</th></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

function renderOrdersTab() {
  const data = currentReconData;
  const rows = Object.entries(data.per_strategy || {}).map(([sid, s]) => `
    <tr>
      <td class="text-left"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${STRATEGY_COLORS[sid]||'#fff'};margin-right:8px;"></span>${s.name || sid}</td>
      <td>${s.order_match ? '✅' : '❌'}</td>
      <td>${s.order_diffs?.length || 0}</td>
    </tr>
  `).join('');
  document.getElementById('recon-content').innerHTML = `
    <div class="table-wrapper">
      <table><thead><tr><th>策略</th><th>状态</th><th>差异数</th></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

function renderFeesTab() {
  const data = currentReconData;
  const rows = Object.entries(data.per_strategy || {}).map(([sid, s]) => `
    <tr>
      <td class="text-left"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${STRATEGY_COLORS[sid]||'#fff'};margin-right:8px;"></span>${s.name || sid}</td>
      <td>${formatMoney(s.total_commission)}</td>
      <td>${formatMoney(s.total_stamp_tax)}</td>
      <td>${formatMoney(s.total_transfer_fee)}</td>
      <td>${formatMoney(s.total_slippage)}</td>
      <td>${formatMoney((s.total_commission||0)+(s.total_stamp_tax||0)+(s.total_transfer_fee||0)+(s.total_slippage||0))}</td>
    </tr>
  `).join('');
  document.getElementById('recon-content').innerHTML = `
    <div class="table-wrapper">
      <table><thead><tr><th>策略</th><th>佣金</th><th>印花税</th><th>过户费</th><th>滑点</th><th>总费用</th></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  // 设置默认日期范围
  const today = new Date().toISOString().split('T')[0];
  const monthAgo = new Date(Date.now() - 30*86400000).toISOString().split('T')[0];
  document.getElementById('filter-start').value = monthAgo;
  document.getElementById('filter-end').value = today;
  
  loadReconciliation();
  
  // 实时时钟
  setInterval(() => {
    const now = new Date();
    document.getElementById('current-date').textContent = now.toLocaleDateString('zh-CN');
    document.getElementById('current-time').textContent = now.toLocaleTimeString('zh-CN', {hour12:false});
  }, 1000);
});
</script>
</body>
</html>
