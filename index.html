<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI量化 · 五策略监控面板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ========== CSS变量设计系统 ========== */
:root {
  /* 背景层级 */
  --bg-base: #0a0a0f;
  --bg-elevated: #12121a;
  --bg-surface: #1a1a28;
  --bg-hover: #222236;
  --bg-active: #2a2a40;

  /* 文字 */
  --text-primary: #e8e8f0;
  --text-secondary: #a0a0b8;
  --text-muted: #606078;
  --text-inverse: #0a0a0f;

  /* 边框 */
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);

  /* 四策略色彩编码 */
  --qixing-start: #3b82f6;
  --qixing-end: #8b5cf6;
  --r32-start: #10b981;
  --r32-end: #06b6d4;
  --zhuidian-start: #f59e0b;
  --zhuidian-end: #f97316;
  /* 三合策略（Fusion R31_vol_weight）：紫金渐变 - 三策略合一的尊贵感 */
  --sanhe-start: #a855f7;
  --sanhe-end: #facc15;
  --lightning-start: #facc15;
  --lightning-end: #f97316;

  /* 状态色 */
  --color-up: #10b981;
  --color-down: #ef4444;
  --color-warn: #f59e0b;
  --color-danger: #ef4444;

  /* 字体 */
  --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  /* 间距 */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;

  /* 圆角 */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  /* 阴影 */
  --shadow-card: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-hover: 0 8px 24px rgba(0,0,0,0.4);
  --shadow-glow-qixing: 0 0 20px rgba(59,130,246,0.15);
  --shadow-glow-r32: 0 0 20px rgba(16,185,129,0.15);
  --shadow-glow-zhuidian: 0 0 20px rgba(245,158,11,0.15);
}

/* ========== 基础重置 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ========== 12列栅格 ========== */
.container { max-width: 1400px; margin: 0 auto; padding: 0 var(--space-lg); }
.row { display: flex; flex-wrap: wrap; margin: 0 calc(-1 * var(--space-sm)); }
.col { flex: 1; padding: 0 var(--space-sm); }
.col-4 { flex: 0 0 33.333%; max-width: 33.333%; padding: 0 var(--space-sm); }
.col-6 { flex: 0 0 50%; max-width: 50%; padding: 0 var(--space-sm); }
.col-8 { flex: 0 0 66.667%; max-width: 66.667%; padding: 0 var(--space-sm); }
.col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 var(--space-sm); }
.col-3 { flex: 0 0 25%; max-width: 25%; padding: 0 var(--space-sm); }

/* ========== 自适应栅格: col-row-N 占 N 分之一宽度 ========== */
.col-row-1, .col-row-2, .col-row-3, .col-row-4, .col-row-5, .col-row-6, .col-row-7,
.col-row-8, .col-row-9, .col-row-10, .col-row-11, .col-row-12 {
  flex: 0 0 calc(100% / 1);
  max-width: calc(100% / 1);
  padding: 0 var(--space-sm);
}
.col-row-2 { flex: 0 0 calc(100% / 2); max-width: calc(100% / 2); }
.col-row-3 { flex: 0 0 calc(100% / 3); max-width: calc(100% / 3); }
.col-row-4 { flex: 0 0 calc(100% / 4); max-width: calc(100% / 4); }
.col-row-5 { flex: 0 0 calc(100% / 5); max-width: calc(100% / 5); }
.col-row-6 { flex: 0 0 calc(100% / 6); max-width: calc(100% / 6); }
.col-row-7 { flex: 0 0 calc(100% / 7); max-width: calc(100% / 7); }
.col-row-8 { flex: 0 0 calc(100% / 8); max-width: calc(100% / 8); }

@media (max-width: 1024px) {
  .col-3, .col-4, .col-6, .col-8 { flex: 0 0 100%; max-width: 100%; }
  .col-row-2, .col-row-3, .col-row-4, .col-row-5, .col-row-6, .col-row-7, .col-row-8 {
    flex: 0 0 100%; max-width: 100%;
  }
}

/* ========== 顶部栏 ========== */
.topbar {
  height: 56px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-lg);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-size: 16px;
  font-weight: 600;
}
.topbar-brand .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--color-up);
  box-shadow: 0 0 6px var(--color-up);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.topbar-meta {
  display: flex;
  align-items: center;
  gap: var(--space-lg);
  color: var(--text-secondary);
  font-size: 12px;
}
.topbar-meta .refresh-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-medium);
  color: var(--text-secondary);
  padding: var(--space-xs) var(--space-sm);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12px;
  transition: all 0.2s;
}
.topbar-meta .refresh-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

/* ========== 今日动作条 ========== */
.action-bar {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-subtle);
  padding: var(--space-md) var(--space-lg);
}
.action-bar-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: var(--space-sm);
}
.action-items {
  display: flex;
  gap: var(--space-md);
}
.action-item {
  flex: 1;
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-md);
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  transition: all 0.2s;
}
.action-item:hover {
  border-color: var(--border-medium);
  transform: translateY(-1px);
}
.action-item.qixing { border-left: 3px solid var(--qixing-start); }
.action-item.r32 { border-left: 3px solid var(--r32-start); }
.action-item.zhuidian { border-left: 3px solid var(--zhuidian-start); }
.action-item.sanhe { border-left: 3px solid var(--sanhe-start); }
.action-item.lightning { border-left: 3px solid var(--lightning-start); }

.action-badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.action-badge.buy { background: rgba(16,185,129,0.15); color: var(--color-up); }
.action-badge.sell { background: rgba(239,68,68,0.15); color: var(--color-down); }
.action-badge.rebalance { background: rgba(6,182,212,0.15); color: var(--r32-end); }
.action-badge.hold { background: rgba(160,160,184,0.15); color: var(--text-secondary); }

.action-detail {
  flex: 1;
}
.action-detail .target {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 600;
}
.action-detail .desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.action-btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-sans);
}
.action-btn.primary {
  background: linear-gradient(135deg, var(--r32-start), var(--r32-end));
  color: var(--text-inverse);
}
.action-btn.primary:hover {
  opacity: 0.9;
  transform: scale(1.02);
}

/* ========== 策略卡片 ========== */
.strategy-section {
  padding: var(--space-lg);
}
.strategy-card {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
  transition: all 0.3s ease;
  cursor: pointer;
  height: 100%;
}
.strategy-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.strategy-card.qixing:hover { box-shadow: var(--shadow-hover), var(--shadow-glow-qixing); }
.strategy-card.r32:hover { box-shadow: var(--shadow-hover), var(--shadow-glow-r32); }
.strategy-card.zhuidian:hover { box-shadow: var(--shadow-hover), var(--shadow-glow-zhuidian); }
.strategy-card.sanhe:hover { box-shadow: var(--shadow-hover), 0 0 20px rgba(168,85,247,0.15); }

.card-header {
  height: 4px;
}
.card-header.qixing { background: linear-gradient(90deg, var(--qixing-start), var(--qixing-end)); }
.card-header.r32 { background: linear-gradient(90deg, var(--r32-start), var(--r32-end)); }
.card-header.zhuidian { background: linear-gradient(90deg, var(--zhuidian-start), var(--zhuidian-end)); }
.card-header.sanhe { background: linear-gradient(90deg, var(--sanhe-start), var(--sanhe-end)); }
.card-header.lightning { background: linear-gradient(90deg, var(--lightning-start), var(--lightning-end)); }

.card-body {
  padding: var(--space-lg);
}
.card-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}
.card-title {
  font-size: 16px;
  font-weight: 600;
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: rgba(16,185,129,0.1);
  color: var(--color-up);
}
.status-badge::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* 三层标签：version / data_period / caliber（v2.0 路线图 P0-4） */
.three-layer-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 var(--space-md) 0;
  padding-bottom: var(--space-sm);
  border-bottom: 1px dashed rgba(255,255,255,0.08);
}
.tlt-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-family: var(--font-mono);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-muted);
  letter-spacing: 0.2px;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tlt-version { border-color: rgba(59,130,246,0.3); color: #93c5fd; }
.tlt-period  { border-color: rgba(16,185,129,0.3); color: #6ee7b7; }
.tlt-caliber { border-color: rgba(245,158,11,0.3); color: #fcd34d; }

/* 大数字区 */
.metric-row {
  display: flex;
  gap: var(--space-lg);
  margin-bottom: var(--space-lg);
}
.metric {
  flex: 1;
}
.metric-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: var(--space-xs);
}
.metric-value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
}
.metric-value.up { color: var(--color-up); }
.metric-value.down { color: var(--color-down); }
.metric-value.neutral { color: var(--text-primary); }

.metric-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* 持仓列表 */
.holdings-list {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--space-md);
}
.holdings-header {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: var(--space-sm);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: var(--space-sm);
}
.holding-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: var(--space-sm);
  padding: var(--space-sm) 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border-subtle);
}
.holding-row:last-child { border-bottom: none; }
.holding-code {
  font-family: var(--font-mono);
  font-weight: 600;
}
.holding-name {
  font-size: 11px;
  color: var(--text-secondary);
}
.holding-pnl.up { color: var(--color-up); }
.holding-pnl.down { color: var(--color-down); }

/* 卡片底部 */
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: var(--space-md);
  border-top: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--text-secondary);
}

/* ========== 收益对比区 ========== */
.chart-section {
  padding: var(--space-lg);
  background: var(--bg-elevated);
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-lg);
}
.section-title {
  font-size: 14px;
  font-weight: 600;
}
.section-tabs {
  display: flex;
  gap: var(--space-xs);
}
.tab {
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.tab:hover { color: var(--text-primary); }
.tab.active {
  background: var(--bg-surface);
  border-color: var(--border-medium);
  color: var(--text-primary);
}

.chart-container {
  height: 320px;
  position: relative;
}

/* ========== 风险监控区 ========== */
.risk-section {
  padding: var(--space-lg);
}
.risk-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
}
@media (max-width: 1024px) {
  .risk-grid { grid-template-columns: 1fr; }
}
.risk-card {
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  border: 1px solid var(--border-subtle);
}
.risk-card.danger {
  border-color: rgba(239,68,68,0.3);
  animation: pulse-danger 2s ease-in-out infinite;
}
@keyframes pulse-danger {
  0%, 100% { box-shadow: 0 0 0 rgba(239,68,68,0); }
  50% { box-shadow: 0 0 12px rgba(239,68,68,0.15); }
}
.risk-title {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: var(--space-sm);
}
.risk-value {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 700;
}
.risk-value.danger { color: var(--color-danger); }
.risk-desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* ========== 策略日志区 ========== */
.log-section {
  padding: var(--space-lg);
  background: var(--bg-elevated);
  border-top: 1px solid var(--border-subtle);
}
.log-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}
.log-item {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-sm) var(--space-md);
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  font-size: 13px;
}
.log-time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  min-width: 140px;
}
.log-strategy {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  min-width: 80px;
  text-align: center;
}
.log-strategy.qixing { background: rgba(59,130,246,0.15); color: var(--qixing-start); }
.log-strategy.r32 { background: rgba(16,185,129,0.15); color: var(--r32-start); }
.log-strategy.zhuidian { background: rgba(245,158,11,0.15); color: var(--zhuidian-start); }
.log-strategy.sanhe { background: rgba(168,85,247,0.15); color: var(--sanhe-start); }
.log-strategy.lightning { background: rgba(250,204,21,0.15); color: var(--lightning-start); }
.log-action {
  font-weight: 600;
}
.log-action.buy { color: var(--color-up); }
.log-action.sell { color: var(--color-down); }
.log-detail {
  color: var(--text-secondary);
  flex: 1;
}

/* ========== 模态面板 ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s;
}
.modal-overlay.active {
  display: flex;
  opacity: 1;
}
.modal-panel {
  background: var(--bg-elevated);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-medium);
  width: 90%;
  max-width: 800px;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transform: scale(0.95);
  transition: transform 0.3s;
}
.modal-overlay.active .modal-panel {
  transform: scale(1);
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-lg);
  border-bottom: 1px solid var(--border-subtle);
}
.modal-title {
  font-size: 16px;
  font-weight: 600;
}
.modal-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.modal-close:hover { color: var(--text-primary); }
.modal-body {
  padding: var(--space-lg);
  overflow-y: auto;
  flex: 1;
}

/* ========== 侧滑面板 ========== */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: 420px;
  max-width: 90vw;
  height: 100vh;
  background: var(--bg-elevated);
  border-left: 1px solid var(--border-medium);
  z-index: 200;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  display: flex;
  flex-direction: column;
}
.drawer.active { transform: translateX(0); }
.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-lg);
  border-bottom: 1px solid var(--border-subtle);
}
.drawer-body {
  padding: var(--space-lg);
  overflow-y: auto;
  flex: 1;
}

/* ========== 对比模式 ========== */
.compare-mode .strategy-card {
  cursor: default;
}
.compare-mode .strategy-card:hover {
  transform: none;
}
.compare-indicator {
  display: none;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  padding: var(--space-xs);
}
.compare-mode .compare-indicator {
  display: block;
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  .action-items { flex-direction: column; }
  .metric-value { font-size: 22px; }
  .risk-grid { grid-template-columns: 1fr; }
  .drawer { width: 100%; }
}

/* ========== 工具类 ========== */
.hidden { display: none !important; }
.text-mono { font-family: var(--font-mono); }
.text-up { color: var(--color-up); }
.text-down { color: var(--color-down); }
.text-warn { color: var(--color-warn); }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="dot"></span>
    <span>AI量化 · 五策略监控面板</span>
  </div>
  <div class="topbar-meta">
    <span id="current-date">2026-06-08</span>
    <span id="current-time">15:00:00</span>
    <span>总资金: <strong class="text-mono" id="total-value">¥400,000.00</strong></span>
    <button class="refresh-btn" onclick="refreshData()" title="快捷键: R">⟳ 刷新</button>
  </div>
</header>

<!-- 今日动作条 -->
<section class="action-bar">
  <div class="container">
    <div class="action-bar-title">今日动作</div>
    <div class="action-items" id="action-items">
      <!-- 动态填充 -->
    </div>

// 渲染今日动作条 (4 策略)
function renderActionItems(strategies) {
  const container = document.getElementById('action-items');

  if (!strategies || strategies.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = strategies.map(s => {

    // 根据策略类型生成 target/desc
    const holdings = s.holdings || [];
    let target = '', desc = '';
    if (holdings.length === 0) {
      target = s.name + ' 无操作';
      desc = '当前无持仓';
    } else if (holdings.length === 1) {
      target = holdings[0].code + ' ' + (holdings[0].name || '');
      desc = '成本 ¥' + (holdings[0].cost || '--') + ' · ' + (holdings[0].qty ? holdings[0].qty.toLocaleString() + ' 股' : '');
    } else {
      const codes = holdings.map(h => h.code).slice(0, 5);

      <div class="action-detail">
        <div class="target">${target}</div>
        <div class="desc">${desc}</div>
      </div>
    </div>`;
  }).join('');
}

// ========== 通用自适应栅格算法 ==========
// 规则: 4-7 策略两排, 8+ 三排, 每排 100% 撑满
//   4 → 2+2     5 → 3+2     6 → 3+3
//   7 → 3+4     8 → 3+3+2   9 → 3+3+3  10 → 4+3+3
function calcGridRows(count) {
  if (count <= 0) return [];
  if (count <= 3) return [count];
  if (count <= 7) {
    // 两排: 第一排 ceil(n/2), 第二排 floor(n/2)
    return [Math.ceil(count / 2), Math.floor(count / 2)];
  }
  // 8+ → 三排: 第一排 3, 第二排 3, 第三排剩余
  if (count === 8) return [3, 3, 2];
  if (count === 9) return [3, 3, 3];
  if (count === 10) return [4, 3, 3];
  if (count === 11) return [4, 4, 3];
  if (count === 12) return [4, 4, 4];
  // 13+: 3 3 3 3 ... 平均分配
  const baseRows = [3, 3, 3];
  let remain = count - 9;
  for (let i = 0; remain > 0; i = (i + 1) % 3) {
    baseRows[i] += 1;
    remain -= 1;
  }
  return baseRows;
}

// 动态生成策略卡片栅格
function renderStrategyCards(strategies) {
  const container = document.getElementById('strategy-cards');
  if (!container) return;
  if (!strategies || strategies.length === 0) {
    container.innerHTML = '<div class="col-12" style="text-align:center;color:var(--text-muted);padding:48px">暂无策略数据</div>';
    return;
  }

  const rows = calcGridRows(strategies.length);
  let html = '';
  let idx = 0;
  rows.forEach((rowSize, rowIdx) => {
    // 复用 row flex 布局
    html += '<div class="row strategy-row" data-row="' + (rowIdx + 1) + '">';
    for (let i = 0; i < rowSize && idx < strategies.length; i++, idx++) {
      const s = strategies[idx];
      const sid = s.id || s.strategy_id;
      const sname = s.name || s.strategy_name || sid;
      // 100% 自适应: 每张 col 宽度 = 100/rowSize
      const colClass = 'col-row-' + rowSize;
      const cardHtml = buildCardHtml(sid, sname, s);
      html += '<div class="' + colClass + '">' + cardHtml + '</div>';
    }
    html += '</div>';
  });
  container.innerHTML = html;
}

function buildCardHtml(sid, sname, s) {
  // 从数据中提取字段
  const holdings = s.holdings || [];
  const totalReturn = s.total_return;
  const position = s.position_pct;
  const cash = s.cash;
  const status = s.status || 'running';
  const statusLabel = status === 'placeholder' ? '占位' : status === 'running' ? '运行中' : status;
  const todayAction = s.today_action || s.action || 'HOLD';
  // R 标签
  const latestRound = s.metrics?.latest_round || s.metrics?.latest_desc || '';

  let holdingsHtml = holdings.map(h => {
    const qty = h.qty ? h.qty.toLocaleString() : (h.weight ? h.weight + '%' : '--');
    const cost = h.cost ? '¥' + h.cost : '--';
    const pnlHtml = h.pnl !== undefined && h.pnl !== null
      ? `<span class="holding-pnl ${h.pnl >= 0 ? 'up' : 'down'}">${h.pnl >= 0 ? '+' : ''}${h.pnl.toFixed(2)} (${h.pnl >= 0 ? '+' : ''}${h.pnl_pct}%)</span>`
      : '<span class="holding-pnl">--</span>';
    return `<div class="holding-row">
      <div><div class="holding-code">${h.code}</div><div class="holding-name">${h.name || ''}</div></div>
      <span class="text-mono">${qty}</span>
      <span class="text-mono">${cost}</span>
      ${pnlHtml}
    </div>`;
  }).join('');

  // 兼容无 holdings 的情况
  if (holdings.length === 0) {
    holdingsHtml = '<div class="holding-row" style="justify-content:center;color:var(--text-muted)">无持仓</div>';
  }

  return `<div class="strategy-card ${sid}" data-strategy="${sid}" onclick="openStrategyDetail('${sid}')">
    <div class="card-header ${sid}"></div>
    <div class="card-body">
      <div class="card-title-row">
        <span class="card-title">${sname} ${latestRound ? `<span style="font-size:10px;color:var(--${sid}-start);margin-left:4px">${latestRound}</span>` : ''}</span>
        <span class="status-badge">${statusLabel}</span>
      </div>
      <div class="three-layer-tags" data-source="${s.metrics?.signal_date || ''}">
        <span class="tlt-tag tlt-version" title="策略版本号（棘轮迭代轮次）">📦 ${s.metrics?.version_tag || latestRound || '未标注'}</span>
        <span class="tlt-tag tlt-period" title="回测数据期">📅 ${s.metrics?.data_period || '未指定'}</span>
        <span class="tlt-tag tlt-caliber" title="指标计算口径">⚙️ ${s.metrics?.caliber || '未指定'}</span>
      </div>
      <div class="metric-row">
        <div class="metric">
          <div class="metric-label">2Y 年化 (主)</div>
          <div class="metric-value ${totalReturn !== undefined && totalReturn !== null ? (totalReturn >= 0 ? 'up' : 'down') : 'neutral'}" data-metric="annualized-return" data-period="2y">${s.metrics?.annualized_return_2y !== undefined ? (s.metrics.annualized_return_2y >= 0 ? '+' : '') + s.metrics.annualized_return_2y.toFixed(2) + '%' : (totalReturn !== undefined && totalReturn !== null ? (totalReturn >= 0 ? '+' : '') + totalReturn.toFixed(2) + '%' : '--')}</div>
          <div class="metric-sub" data-metric="annualized-return-5y" data-period="5y" style="font-size:11px;color:var(--text-muted);margin-top:2px">5Y: ${s.metrics?.annualized_return_5y !== undefined && s.metrics.annualized_return_5y !== null ? (s.metrics.annualized_return_5y >= 0 ? '+' : '') + s.metrics.annualized_return_5y.toFixed(2) + '%' : '--'}</div>
        </div>
        <div class="metric">
          <div class="metric-label">仓位</div>
          <div class="metric-value neutral" data-metric="position">${position !== undefined ? position.toFixed(1) + '%' : '--'}</div>
          <div class="metric-sub" data-metric="dd-2y" style="font-size:10px;color:var(--text-muted)">2Y回撤 ${s.metrics?.max_dd_2y !== undefined ? s.metrics.max_dd_2y.toFixed(2) + '%' : '--'}</div>
        </div>
      </div>
      <div class="holdings-list">
        <div class="holdings-header">
          <span>标的</span><span>${holdings.length > 0 && holdings[0].weight ? '权重' : '数量'}</span><span>成本</span><span>盈亏</span>
        </div>
        ${holdingsHtml}
      </div>
      <div class="card-footer">
        <span class="card-footer-cash">现金 ¥${cash !== undefined ? cash.toFixed(2) : '--'}</span>

    </div>
  </div>`;
}

// 渲染交易明细 (3+1 四策略)
function renderTradeDetails(strategies) {
  const container = document.getElementById('trade-details');
  if (!container) return;
  if (!strategies || strategies.length === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = strategies.map(s => {
    const sid = s.id || s.strategy_id;
    const sname = s.name || s.strategy_name || sid;
    const holdings = s.holdings || [];
    const totalCount = holdings.length;
    const totalAmt = holdings.reduce((sum, h) => {
      const qty = h.qty || 0;
      const price = h.price || h.cost || 0;
      return sum + qty * price;
    }, 0);
    const cash = s.cash || 0;
    const totalAsset = totalAmt + cash;
    return `<div class="trade-card ${sid}">
      <div class="trade-card-header">
        <span class="trade-card-title">${sname}</span>
        <span class="trade-card-badge ${s.today_action === 'BUY' ? 'buy' : (s.today_action === 'SELL' ? 'sell' : 'rebalance')}">${s.today_action || 'HOLD'}</span>

                <div class="trade-qty">${(h.qty || 0).toLocaleString()}股</div>

              </div>
            </div>`;
          }).join('')}
      </div>
      <div class="trade-card-footer">

// 渲染收益对比图 (3+1 四策略)
function renderNavCurves(strategies) {
  const ctx = document.getElementById('returnChart');
  if (!ctx) return;
  const colors = {
    qixing: { border: '#3b82f6', bg: 'rgba(59,130,246,0.08)' },
    r32: { border: '#10b981', bg: 'rgba(16,185,129,0.08)' },
    zhuidian: { border: '#f59e0b', bg: 'rgba(245,158,11,0.08)' },
    sanhe: { border: '#a855f7', bg: 'rgba(168,85,247,0.08)' }
  };
  if (currentChart) { currentChart.destroy(); }
  let labels = ['09:30', '10:00', '10:30', '11:00', '11:30', '13:00', '13:30', '14:00', '14:30', '15:00'];
  let datasets = (strategies || []).map((s, i) => {
    const sid = s.id || s.strategy_id;
    const sname = s.name || s.strategy_name || sid;
    // 模拟日内收益
    const base = s.total_return !== undefined ? s.total_return : 0;
    const arr = labels.map((_, k) => +(base - (labels.length - 1 - k) * 0.3 + (Math.random() - 0.5) * 0.5).toFixed(2));
    const c = colors[sid] || { border: '#888', bg: 'rgba(136,136,136,0.08)' };
    return {
      label: sname,
      data: arr,
      borderColor: c.border,
      backgroundColor: c.bg,
      fill: false,
      tension: 0.3,
      pointRadius: 1,
      borderWidth: 2
    };
  });
  currentChart = new Chart(ctx.getContext('2d'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: '#a0a0b8', font: { family: 'SF Mono, Consolas, monospace', size: 11 }, usePointStyle: true, boxWidth: 8 } },
        tooltip: {
          backgroundColor: 'rgba(10,10,15,0.9)',
          titleColor: '#e8e8f0',
          bodyColor: '#a0a0b8',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          callbacks: { label: c => c.dataset.label + ': ' + (c.parsed.y >= 0 ? '+' : '') + c.parsed.y.toFixed(2) + '%' }
        }
      },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#606078', maxTicksLimit: 8, font: { size: 10 } } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#606078', callback: v => v + '%', font: { size: 10 } } }
      }
    }
  });
}

// 渲染策略变更日志 (动态生成 4 策略)
function renderLogs(strategies) {
  const container = document.getElementById('strategy-logs');
  if (!container) return;
  if (!strategies || strategies.length === 0) { container.innerHTML = ''; return; }
  // 4 策略各自的最近事件 (与 metrics 联动)
  const labelMap = { qixing: '七星', r32: 'R32', zhuidian: '追电', sanhe: '三合' };
  const logs = [];
  strategies.forEach(s => {
    const sid = s.id || s.strategy_id;
    const r = s.metrics?.latest_round || '';
    const desc = s.metrics?.latest_desc || s.metrics?.data_period || '';
    const action = s.today_action || 'PARAM';
    const annRet = s.metrics?.annualized_return !== undefined ? `年化 ${(s.metrics.annualized_return*100).toFixed(2)}%` : '';
    logs.push({
      time: new Date().toISOString().substring(0, 16).replace('T', ' '),
      sid,
      label: labelMap[sid] || sid,
      action,
      detail: r ? `${r} ${desc} ${annRet}`.trim() : (s.name || sid) + ' 实盘运行中'
    });
  });
  // 按时间倒序
  logs.sort((a, b) => b.time.localeCompare(a.time));
  container.innerHTML = logs.map(l => {
    const badgeClass = (l.action || 'param').toLowerCase();
    return `<div class="log-item">
      <span class="log-time">${l.time}</span>
      <span class="log-strategy ${l.sid}">${l.label}</span>
      <span class="log-action ${badgeClass}">${l.action}</span>
      <span class="log-detail">${l.detail}</span>
    </div>`;
  }).join('');
}

// ========== 时钟更新 ==========
function updateClock() {
  const now = new Date();
  document.getElementById('current-date').textContent = now.toLocaleDateString('zh-CN');
  document.getElementById('current-time').textContent = now.toLocaleTimeString('zh-CN');
}
setInterval(updateClock, 1000);
updateClock();

// ========== 刷新数据 ==========
function refreshData() {
  const btn = document.querySelector('.refresh-btn');
  btn.textContent = '⟳ 刷新中...';
  setTimeout(() => {
    btn.textContent = '⟳ 刷新';
    // 模拟数据更新
    console.log('数据已刷新');
  }, 500);
}

// ========== 按日期加载复盘 ==========
function loadReviewByDate(date) {
  // 更新日志区显示对应日期的复盘摘要
  const logs = getLogsForDate(date);
  const container = document.getElementById('strategy-logs');
  if (logs && logs.length > 0) {
    container.innerHTML = logs.map(log => `
      <div class="log-item">
        <span class="log-time">${log.time}</span>
        <span class="log-strategy ${log.strategy}">${log.strategyName}</span>
        <span class="log-action ${log.action.toLowerCase()}">${log.action}</span>
        <span class="log-detail">${log.detail}</span>
      </div>
    `).join('');
  } else {
    container.innerHTML = `
      <div class="log-item" style="justify-content:center;color:var(--text-muted)">
        ${date === '2026-06-08' ? '今日暂无更多日志' : '该日期暂无复盘记录'}
      </div>
    `;
  }
}

// 获取指定日期的日志（实际应从review/目录加载）
function getLogsForDate(date) {
  if (date === '2026-06-08') {
    return [
      { time: '2026-06-14 16:00', strategy: 'sanhe', strategyName: '三合', action: 'PARAM', detail: '三合策略 60 轮棘轮迭代完成 - 基线 R31_vol_weight' },
      { time: '2026-06-14 15:30', strategy: 'sanhe', strategyName: '三合', action: 'BASELINE', detail: '2Y年化+35.15%/回撤-23.38% · 5Y年化+17.48%/回撤-21.80%' },
      { time: '2026-06-11 15:00', strategy: 'qixing', strategyName: '七星', action: 'PARAM', detail: '七星策略棘轮基线同步为 R26 持仓1只' },
      { time: '2026-06-08 09:30', strategy: 'r32', strategyName: 'R32', action: 'REBALANCE', detail: '调仓至 5只ETF等权重' },
      { time: '2026-06-08 09:30', strategy: 'zhuidian', strategyName: '追电', action: 'BUY', detail: '买入 513100 纳指ETF 4,530股 @ ¥2.205' }
    ];
  }
  return [];
}

// ========== 执行动作 ==========
function executeAction(strategyId) {
  const all = strategiesData.strategies || strategiesData.mockData?.strategies || [];
  const s = all.find(x => x.id === strategyId);
  if (!s) return alert('策略数据未加载');
  if (confirm(`确认执行【${s.name}】的${s.today_action}操作？`)) {
    alert('指令已发送（模拟）');
  }
}

// ========== 策略详情模态 ==========
function openStrategyDetail(id) {
  const all = strategiesData.strategies || strategiesData.mockData?.strategies || [];
  const s = all.find(x => x.id === id);
  if (!s) return;
  document.getElementById('modal-title').textContent = s.name + ' · 详情';
  document.getElementById('modal-body').innerHTML = `
    <div class="metric-row">
      <div class="metric">
        <div class="metric-label">当前动作</div>
        <div class="metric-value" style="font-size:20px">${s.today_action || s.action || 'HOLD'}</div>
      </div>
      <div class="metric">
        <div class="metric-label">仓位</div>
        <div class="metric-value">${s.position_pct || s.position || 0}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">现金</div>
        <div class="metric-value">¥${(s.cash || 0).toFixed(2)}</div>
      </div>
    </div>
    <h4 style="margin:24px 0 12px;font-size:14px;color:var(--text-muted)">持仓明细</h4>
    ${(s.holdings || []).map(h => `
      <div class="holding-row" style="grid-template-columns:1fr 1fr 1fr 1fr">
        <div><div class="holding-code">${h.code}</div><div class="holding-name">${h.name}</div></div>
        <span class="text-mono">${h.qty ? h.qty.toLocaleString() : (h.weight + '%')}</span>
        <span class="text-mono">¥${h.cost}</span>
        <span class="holding-pnl ${(h.pnl||0) >= 0 ? 'up' : 'down'}">${h.pnl ? (h.pnl>=0?'+':'')+h.pnl.toFixed(2)+' ('+(h.pnl>=0?'+':'')+h.pnl_pct+'%)' : '--'}</span>
      </div>
    `).join('')}
    <h4 style="margin:24px 0 12px;font-size:14px;color:var(--text-muted)">策略版本与回测绩效</h4>
    <div class="metric-row">
      <div class="metric">
        <div class="metric-label">最新策略</div>
        <div class="metric-value neutral">${s.metrics?.latest_round !== undefined ? (String(s.metrics.latest_round).startsWith('R') ? s.metrics.latest_round : (s.metrics.latest_round ? `R${s.metrics.latest_round}` : '追电1.0')) : '--'}</div>
        <div class="metric-sub">${s.metrics?.latest_desc || '未标注'} · ${s.metrics?.data_period || '未标注'}</div>
      </div>
      ${s.metrics?.total_return_2y !== undefined ? `
        <div class="metric">
          <div class="metric-label">2Y回测</div>
          <div class="metric-value up">+${s.metrics.total_return_2y}%</div>
          <div class="metric-sub">回撤 ${s.metrics.max_dd_2y}% · ${s.metrics.trades_2y}笔</div>
        </div>
      ` : ''}
      ${s.metrics?.total_return_5y !== undefined ? `
        <div class="metric">
          <div class="metric-label">5Y回测</div>
          <div class="metric-value up">+${s.metrics.total_return_5y}%</div>
          <div class="metric-sub">回撤 ${s.metrics.max_dd_5y}% · ${s.metrics.trades_5y}笔</div>
        </div>
      ` : ''}
      <div class="metric">
        <div class="metric-label">年化/夏普</div>
        <div class="metric-value up">+${s.metrics?.annualized_return ?? s.metrics?.annual_return ?? '--'}%</div>
        <div class="metric-sub">夏普 ${s.metrics?.sharpe ?? '--'} · 引擎 ${s.metrics?.engine_version || '未标注'}</div>
      </div>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('active');
  }
}

// ========== 侧滑面板 ==========
function openDrawer(title, content) {
  document.getElementById('drawer-title').textContent = title;
  document.getElementById('drawer-body').innerHTML = content;
  document.getElementById('drawer').classList.add('active');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('active');
}

// ========== 图表 ==========
// currentChart 已在顶部声明

let currentChartPeriod = 'live';

function initChart() {
  // 默认加载实盘净值曲线（三策略对比）
  loadNavCurves('live');
}

async function loadNavCurves(period) {
  currentChartPeriod = period;
  try {
    const res = await fetch(`${DataLayer.config.apiBase}/dashboard/nav_curves`);
    const result = await res.json();
    if (result.code === 0) {
      renderMultiChart(result.data.curves, period);
      return;
    }
  } catch (err) {
    console.error('净值曲线加载失败:', err);
  }
  // 回退到模拟数据
  renderMultiChart(null, period);
}

function switchChart(period) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  loadNavCurves(period);
}

// ========== 键盘快捷键 ==========
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeDrawer(); }
  if (e.key === 'r' || e.key === 'R') refreshData();
  if (e.key === '1') openStrategyDetail('qixing');
  if (e.key === '2') openStrategyDetail('r32');
  if (e.key === '3') openStrategyDetail('zhuidian');
  if (e.key === '4') openStrategyDetail('sanhe');
});

// ========== 初始化 ==========
window.addEventListener('DOMContentLoaded', () => {
  initChart();
  initData();
});
</script>

</html>
